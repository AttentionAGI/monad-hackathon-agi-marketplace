<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Attention · Signing in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; color: #f5f5f7;
    font: 17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: linear-gradient(115deg, #070a24 0%, #14216b 35%, #3d1f6b 62%, #802666 100%) }
  a, button { display: inline-block; margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 999px; background: #fff; color: #0f1238; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer }
  p { color: rgba(235,235,245,.62); font-size: 14px; max-width: 30ch; margin: 10px auto 0 }
</style></head>
<body><main><h2 id="title">Back to Attention…</h2><p id="sub">Finishing sign-in in the app.</p><a id="go" href="#">Open Attention</a></main>
<script>
  // OAuth relay: the provider sends ?code&state here. Nothing is stored or sent anywhere else, and the code can't be
  // used without the key that stays on Attention's server.
  //  - Web app (attentionai.dev): it opened this window as a popup. Hand the query back by postMessage to the opener
  //    and, if the provider's Cross-Origin-Opener-Policy cut that link, by BroadcastChannel (same origin), then close.
  //  - iPhone app: hand it straight to the app's sign-in sheet (attention://).
  (function () {
    var query = location.search;
    var web = false;
    try { var t = Number(localStorage.getItem('attention.oauth.pending')); web = t > 0 && Date.now() - t < 15 * 60 * 1000; } catch (e) {}
    var opener = null;
    try { opener = window.opener; } catch (e) {}
    if (opener || web) {
      var msg = { type: 'oauth', query: query };
      try {
        if (opener) {
          opener.postMessage(msg, 'https://attentionai.dev');
          if (location.origin !== 'https://attentionai.dev') opener.postMessage(msg, location.origin);
        }
      } catch (e) {}
      try { var bc = new BroadcastChannel('attention-oauth'); bc.postMessage(msg); bc.close(); } catch (e) {}
      try { localStorage.removeItem('attention.oauth.pending'); } catch (e) {}
      document.getElementById('title').textContent = 'Signed in';
      document.getElementById('sub').textContent = 'You can close this window and go back to Attention.';
      var go = document.getElementById('go');
      go.textContent = 'Close window';
      go.href = '/';
      go.onclick = function (e) { e.preventDefault(); window.close(); };
      setTimeout(function () { window.close(); }, 400);
      return;
    }
    var target = 'attention://oauth/callback' + query;
    document.getElementById('go').href = target;
    location.replace(target);
  })();
</script></body></html>
